<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M268 Dashboard</title>
    <script>
      (() => {
        const navigation = performance.getEntriesByType('navigation')[0];
        if (navigation && navigation.type === 'reload') {
          window.dashboardReloading = true;
          document.documentElement.style.visibility = 'hidden';
          fetch('/logout', { method: 'POST', credentials: 'same-origin', keepalive: true })
            .finally(() => window.location.replace('/login'));
        }
      })();
    </script>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --panel-strong: #182338;
        --text: #eaf2ff;
        --muted: #9cb0d0;
        --line: rgba(255,255,255,0.08);
        --shadow: rgba(15,23,42,0.35);
        --brand: #2f6fed;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #0b1020 0%, #111b2f 100%);
        color: var(--text);
      }

      .shell {
        max-width: 1320px;
        margin: 0 auto;
        padding: 32px 22px 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
        letter-spacing: -0.04em;
      }

      .title-wrap p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 1.03rem;
      }

      .badge {
        background: rgba(47, 111, 237, 0.14);
        border: 1px solid rgba(110, 157, 255, 0.25);
        color: #dfeaff;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(180px, 1fr));
        gap: 18px;
        margin-bottom: 26px;
      }

      .card {
        background: rgba(18, 26, 43, 0.96);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 14px 30px var(--shadow);
      }

      .metric-card {
        padding: 20px 18px;
        min-height: 150px;
        position: relative;
        overflow: hidden;
      }

      .metric-card::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 4px;
        background: var(--accent, var(--brand));
      }

      .metric-label {
        color: var(--muted);
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .metric-value {
        font-size: clamp(1.5rem, 2.2vw, 2.2rem);
        font-weight: 800;
        margin-top: 18px;
        letter-spacing: -0.04em;
      }

      .metric-detail {
        margin-top: 12px;
        color: #dfe8ff;
        font-weight: 600;
        font-size: 0.92rem;
      }

      .content-grid {
        display: grid;
        grid-template-columns: 2fr 1.2fr;
        gap: 22px;
      }

      .panel {
        padding: 22px;
        min-width: 0;
        overflow: hidden;
      }

      .panel h2 {
        margin: 0 0 18px;
        font-size: 1.1rem;
        letter-spacing: -0.02em;
      }

      .bars {
        display: flex;
        align-items: flex-end;
        gap: 14px;
        height: 220px;
        padding-top: 12px;
      }

      .bar-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        height: 100%;
      }

      .bar {
        width: 100%;
        max-width: 52px;
        border-radius: 12px 12px 0 0;
        min-height: 10px;
        box-shadow: inset 0 -10px 18px rgba(255,255,255,0.08), 0 8px 20px rgba(0,0,0,0.18);
        position: relative;
      }

      .bar-value {
        font-size: 0.72rem;
        color: var(--muted);
      }

      .bar-label {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      .progress-row {
        display: grid;
        grid-template-columns: 90px 1fr 52px;
        align-items: center;
        gap: 12px;
      }

      .progress-label {
        color: var(--muted);
        font-size: 0.86rem;
      }

      .progress-track {
        height: 12px;
        background: rgba(255,255,255,0.06);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        border-radius: 999px;
      }

      .progress-value {
        text-align: right;
        font-size: 0.8rem;
        color: #edf5ff;
        font-weight: 700;
      }

      .notes {
        list-style: none;
        padding: 0;
        margin: 18px 0 0;
        display: grid;
        gap: 12px;
      }

      .notes li {
        border-left: 3px solid var(--brand);
        padding-left: 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      .search-panel { margin: 22px 0; padding: 22px; }
      .search-row { display: flex; gap: 12px; align-items: center; }
      .search-row input {
        flex: 1; min-width: 0; padding: 14px 16px; border-radius: 12px;
        border: 1px solid var(--line); background: #0d1526; color: var(--text);
        font-size: 1rem; outline: none;
      }
      .search-row input:focus { border-color: var(--brand); }
      .quick-filters { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      .quick-filters button { border: 1px solid var(--line); background: #1b2a47; color: var(--text); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
      .quick-filters button:hover { background: var(--brand); }
      .refresh-info { color: var(--muted); font-size: .82rem; margin-top: 10px; }
      .detail-empty { color: var(--muted); line-height: 1.5; }
      .sales-detail { display: grid; gap: 18px; min-width: 0; overflow-x: auto; }
      .sales-header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
      .sales-header h3 { margin: 0; font-size: 1.25rem; }
      .sales-header span { color: var(--muted); font-size: .86rem; }
      .detail-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .detail-metric { background: rgba(255,255,255,.04); padding: 14px; border-radius: 12px; }
      .detail-metric b { display: block; font-size: 1.05rem; margin-top: 5px; }
      .detail-label { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; }
      .product-table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: .86rem; }
      .product-table th, .product-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
      .product-table th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
      .product-table td:last-child, .product-table th:last-child { text-align: right; }
      .product-table td:nth-child(2), .product-table th:nth-child(2) { text-align: right; }
      .schedule-table-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; }
      .schedule-table { min-width: 1500px; margin: 0; }
      .closing-report { gap: 6px; max-width: 430px; }
      .closing-report .sales-header { border-bottom: 1px solid #111; padding-bottom: 4px; }
      .closing-report .sales-header h3 { font-family: Arial, sans-serif; font-size: .78rem; color: #111; }
      .closing-report .sales-header span { font-size: .7rem; color: #333; }
      .closing-report .closing-sheet { background: #fff; color: #111; border: 2px solid #111; padding: 5px 7px; font: 10px/1.18 Arial, sans-serif; white-space: pre-wrap; overflow-wrap: anywhere; }
      .closing-report .closing-sheet table { width: 100%; border-collapse: collapse; }
      .closing-report .closing-sheet th, .closing-report .closing-sheet td { padding: 1px 0; border: 0; color: #111; font: inherit; text-align: left; vertical-align: top; }
      .closing-report .closing-sheet th { width: 58%; font-weight: 400; }
      .closing-report .closing-sheet td { text-align: right; }
      .closing-report .closing-section { margin: 5px 0 2px; font-weight: 700; }
      .closing-report .copy-report { justify-self: start; border: 0; border-radius: 5px; padding: 7px 10px; background: #2f6fed; color: #fff; font-weight: 700; cursor: pointer; }
      .closing-report .refresh-info { font-size: .7rem; margin-top: 2px; }
      .schedule-table th, .schedule-table td { min-width: 78px; text-align: center; white-space: nowrap; }
      .schedule-table th small { display: block; margin-top: 3px; color: var(--muted); font-size: .68rem; text-transform: none; }
      .schedule-table .schedule-sticky { position: sticky; left: 0; z-index: 2; min-width: 150px; text-align: left; background: #18243a; box-shadow: 8px 0 12px rgba(0,0,0,.18); }
      .schedule-table thead .schedule-sticky { z-index: 3; }
      .schedule-table td.shift-morning { color: #86efac; }
      .schedule-table td.shift-afternoon { color: #93c5fd; }
      .schedule-table td.shift-middle { color: #fcd34d; }
      .schedule-table td.shift-off, .schedule-table td.shift-leave { color: var(--muted); }

      @media (max-width: 980px) {
        .metrics-grid {
          grid-template-columns: repeat(2, minmax(180px,1fr));
        }

        .content-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 540px) {
        .metrics-grid {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="title-wrap">
          <h1 id="title">M268 Executive Dashboard</h1>
          <p id="subtitle">September 2026 • Performance & Growth Tracking</p>
        </div>
        <div class="badge" id="status-badge">LIVE · AUTO REFRESH</div>
      </div>

      <section class="metrics-grid" id="metrics"></section>

      <section class="card search-panel">
        <h2>Search Sales Performance</h2>
        <div class="search-row">
          <input id="sales-search" type="search" placeholder="Virginia, Rahman, iPhone, iPad, Mac, Watch, AirPods, atau Report Closing" autocomplete="off" />
          <input id="date-filter" type="date" aria-label="Filter tanggal" />
        </div>
        <div class="quick-filters">
          <button type="button" data-filter="M268">M268</button>
          <button type="button" data-filter="closing M268">Report Closing</button>
          <button type="button" data-filter="stock iphone">Stock iPhone</button>
          <button type="button" data-filter="stock mac">Stock Mac</button>
          <button type="button" data-filter="stock watch">Stock Watch</button>
          <button type="button" data-filter="stock ipad">Stock iPad</button>
          <button type="button" data-filter="BNPL">BNPL detail</button>
          <button type="button" data-filter="Kredivo">Kredivo</button>
          <button type="button" data-filter="Akulaku">Akulaku</button>
          <button type="button" data-filter="ShopeePay Later">ShopeePay Later</button>
          <button type="button" data-filter="mading">Mading</button>
          <button type="button" data-filter="roster">Roster team</button>
          <button type="button" data-filter="database">Database toko</button>
        </div>
        <div class="refresh-info" id="refresh-info">Memuat data terbaru...</div>
      </section>

      <section class="card panel" id="sales-detail">
        <div class="detail-empty">Ketik nama sales untuk melihat detail performa, LOB, dan insentif.</div>
      </section>

      <section class="content-grid">
        <div class="card panel">
          <h2>Revenue by Segment</h2>
          <div class="bars" id="segment-bars"></div>
        </div>

        <div class="card panel">
          <h2>LOB Focus</h2>
          <div class="stack" id="lob-stack"></div>
        </div>
      </section>

      <section class="content-grid" style="margin-top: 22px;">
        <div class="card panel">
          <h2>BNPL Contribution Mix</h2>
          <div class="stack" id="bnpl-stack"></div>
        </div>

        <div class="card panel">
          <h2>Highlights</h2>
          <ul class="notes" id="notes"></ul>
        </div>
      </section>
    </div>

    <script>
      let data = {
        title: 'M268 Executive Dashboard',
        subtitle: 'September 2026 • Performance & Growth Tracking',
        metrics: [],
        segments: [],
        lob: [],
        bnpl: [],
        promoters: [],
        mading: { categories: [], units: [], totalPrice: 0 },
        notes: [],
        sales: [],
        incentivePerUnit: {}
        , roster: []
      };

      const metricRoot = document.getElementById('metrics');
      const segmentRoot = document.getElementById('segment-bars');
      const lobRoot = document.getElementById('lob-stack');
      const bnplRoot = document.getElementById('bnpl-stack');
      const notesRoot = document.getElementById('notes');
      const searchInput = document.getElementById('sales-search');
      const detailRoot = document.getElementById('sales-detail');
      const refreshInfo = document.getElementById('refresh-info');
      const dateFilter = document.getElementById('date-filter');

      const formatRp = value => `Rp ${Math.round(value || 0).toLocaleString('id-ID')}`;
      const formatPct = value => `${((value || 0) * 100).toFixed(1)}%`;
      const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[char]));

      function renderDashboard() {
        document.getElementById('title').textContent = data.title;
        document.getElementById('subtitle').textContent = data.subtitle;
        metricRoot.innerHTML = '';
        notesRoot.innerHTML = '';
        data.metrics.forEach(metric => {
        const card = document.createElement('div');
        card.className = 'card metric-card';
        card.style.setProperty('--accent', metric.accent || '#2f6fed');
        card.innerHTML = `
          <div class="metric-label">${metric.label}</div>
          <div class="metric-value">${metric.value}</div>
          <div class="metric-detail">${metric.detail}</div>
        `;
        metricRoot.appendChild(card);
        });
        renderBars(segmentRoot, data.segments);
        renderProgress(lobRoot, data.lob);
        renderProgress(bnplRoot, data.bnpl);
        data.notes.forEach(note => {
          const li = document.createElement('li');
          li.textContent = note;
          notesRoot.appendChild(li);
        });
        renderSalesDetail(searchInput.value);
      }

      function renderBars(root, items) {
        const max = Math.max(...items.map(item => item.value), 1);
        root.innerHTML = items.map(item => {
          const height = (item.value / max) * 100;
          return `
            <div class="bar-col">
              <div class="bar-value">${item.value}</div>
              <div class="bar" style="height: ${height}%; background: ${item.color};"></div>
              <div class="bar-label">${item.label}</div>
            </div>
          `;
        }).join('');
      }

      function renderProgress(root, items) {
        const total = items.reduce((sum, item) => sum + item.value, 0) || 1;
        root.innerHTML = items.map(item => {
          const pct = (item.value / total) * 100;
          return `
            <div class="progress-row">
              <div class="progress-label">${item.label}</div>
              <div class="progress-track"><div class="progress-fill" style="width: ${pct}%; background: ${item.color};"></div></div>
              <div class="progress-value">${pct.toFixed(0)}%</div>
            </div>
          `;
        }).join('');
      }

      function renderSalesDetail(query) {
        const normalized = query.trim().toLowerCase()
          .replace(/[\/_-]+/g, ' ')
          .replace(/\s+/g, ' ');
        const dateKey = dateFilter.value;
        const bnplProviders = [
          ['kredivo', 'kredivo'],
          ['akulaku', 'akulaku'],
          ['shopeepay', 'shopeepay'],
          ['shopee pay later', 'shopeepay'],
          ['hci', 'hci']
        ];
        const selectedBnplProvider = bnplProviders.find(([keyword]) => normalized.includes(keyword))?.[1];
        const isMadingFilter = normalized.includes('mading');
        const isDatabaseFilter = normalized.includes('database') || normalized.includes('data base');
        const stockUnitMap = { iphone: 'iPhone', ipad: 'iPad', mac: 'Mac', watch: 'Apple Watch' };
        const selectedStockUnit = normalized.includes('stock') ? Object.keys(stockUnitMap).find(key => normalized.includes(key)) : null;
        const isRosterFilter = normalized.includes('roster');
        const unitMap = { iphone: 'iPhone', ipad: 'iPad', mac: 'Mac', desktop: 'Mac', laptop: 'Mac', watch: 'Apple Watch', airpods: 'AirPods' };
        const selectedUnit = Object.keys(unitMap).find(key => normalized.includes(key));
        const isBnplFilter = normalized.includes('bnpl') || Boolean(selectedBnplProvider);
        const periodKey = normalized.includes('ly') ? 'LY' : normalized.includes('lm') ? 'LM' : normalized.includes('cm') || normalized.includes('m268') ? 'CM' : '';
        const isClosingReport = normalized.includes('closing');
        const nameQuery = normalized
          .replace(/\b(closing|report|stock|sales|staff|team|provider|unit|detail|iphone|ipad|mac|desktop|laptop|watch|apple|airpods|m268|cm|lm|ly|bnpl|kredivo|akulaku|hci|shopeepay|later|qoala|telkomsel|indosat|xl|xxl)\b/g, '')
          .trim();
        if (isRosterFilter) {
          detailRoot.innerHTML = `
            <div class="sales-detail">
              <div class="sales-header"><h3>Roster Team</h3><span>${data.roster.length} anggota</span></div>
              <div class="schedule-table-wrap"><table class="product-table schedule-table"><thead><tr><th class="schedule-sticky">Nama</th><th>Posisi</th>${(data.roster[0]?.schedule || []).map(item => `<th>${item.date.slice(8)}<small>${new Date(`${item.date}T00:00:00`).toLocaleDateString('id-ID', { weekday: 'short' })}</small></th>`).join('')}</tr></thead>
              <tbody>${data.roster.map(member => `<tr><td class="schedule-sticky">${escapeHtml(member.name)}</td><td>${escapeHtml(member.position)}</td>${(member.schedule || []).map(item => `<td class="shift-${item.code.replace(/[^A-Z]/g, '').toLowerCase()}">${escapeHtml(item.label)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
              <div class="refresh-info">Kode jadwal: Morning (D047) · Afternoon (D103) · Middle (D083) · OFF · Leave (X&amp;C).</div>
            </div>`;
          return;
        }
        if (isDatabaseFilter) {
          detailRoot.innerHTML = `
            <div class="sales-detail">
              <div class="sales-header"><h3>Database Toko</h3><span>${data.database?.length || 0} data</span></div>
              <label class="refresh-info" for="database-page-size">Tampilkan
                <select id="database-page-size"><option value="10">10</option><option value="50">50</option><option value="100">100</option></select>
                data
              </label>
              <div class="schedule-table-wrap"><table class="product-table"><thead><tr><th>ID</th><th>Mulai</th><th>Selesai</th><th>Nama Customer</th><th>No. HP</th><th>Produk Dicari</th></tr></thead>
              <tbody id="database-table-body"></tbody></table></div>
            </div>`;
          const databaseRows = data.database || [];
          const databaseBody = document.getElementById('database-table-body');
          const renderDatabaseRows = limit => {
            databaseBody.innerHTML = databaseRows.length
              ? databaseRows.slice(0, limit).map(item => `<tr><td>${escapeHtml(item.id)}</td><td>${escapeHtml(item.startTime)}</td><td>${escapeHtml(item.completionTime)}</td><td>${escapeHtml(item.customer)}</td><td>${escapeHtml(item.phone)}</td><td>${escapeHtml(item.product)}</td></tr>`).join('')
              : '<tr><td colspan="6">Database kosong.</td></tr>';
          };
          const pageSize = document.getElementById('database-page-size');
          renderDatabaseRows(Number(pageSize.value));
          pageSize.addEventListener('change', () => renderDatabaseRows(Number(pageSize.value)));
          return;
        }
        if (selectedStockUnit) {
          const stockItem = data.stock?.[stockUnitMap[selectedStockUnit]] || { qty: 0, items: [] };
          const stockUpdatedAt = data.stockUpdatedAt ? new Date(data.stockUpdatedAt).toLocaleString('id-ID') : 'Tidak tersedia';
          detailRoot.innerHTML = `<div class="sales-detail"><div class="sales-header"><h3>Stock ${stockUnitMap[selectedStockUnit]}</h3><span>Stock toko terbaru</span></div><div class="refresh-info">Tanggal update file asli: ${escapeHtml(stockUpdatedAt)}</div><div class="detail-metrics"><div class="detail-metric"><span class="detail-label">Total Qty Stock</span><b>${stockItem.qty}</b></div><div class="detail-metric"><span class="detail-label">Total Nilai Stock</span><b>${formatRp(stockItem.amount)}</b></div></div><table class="product-table"><thead><tr><th>Article</th><th>Deskripsi</th><th>Qty</th><th>Harga Satuan</th><th>Total Harga</th></tr></thead><tbody>${stockItem.items.length ? stockItem.items.map(item => `<tr><td>${escapeHtml(item.article)}</td><td>${escapeHtml(item.description)}</td><td>${item.qty}</td><td>${formatRp(item.price)}</td><td>${formatRp(item.qty * item.price)}</td></tr>`).join('') : '<tr><td colspan="5">Tidak ada stok.</td></tr>'}</tbody></table></div>`;
          return;
        }
        const serviceKeywords = ['qoala', 'telkomsel', 'indosat', 'xl', 'xxl'];
        const selectedService = serviceKeywords.find(service => normalized.includes(service));
        if (selectedService && !nameQuery) {
          const serviceRows = data.mading.services.filter(item => item.label.toLowerCase().includes(selectedService));
          detailRoot.innerHTML = `
            <div class="sales-detail">
              <div class="sales-header"><h3>${selectedService.toUpperCase()}</h3><span>Ringkasan layanan</span></div>
              ${serviceRows.length ? `<table class="product-table"><thead><tr><th>Layanan</th><th>Qty</th><th>Total Harga</th></tr></thead><tbody>${serviceRows.map(item => `<tr><td>${escapeHtml(item.label)}</td><td>${item.qty}</td><td>${formatRp(item.amount)}</td></tr>`).join('')}</tbody></table>` : '<div class="detail-empty">Tidak ada data layanan untuk kata kunci ini.</div>'}
            </div>`;
          return;
        }
        if (isMadingFilter) {
          const categories = data.mading.categories;
          detailRoot.innerHTML = `
            <div class="sales-detail">
              <div class="sales-header"><h3>Mading · Target vs ACV</h3><span>Performa M268 berjalan</span></div>
              <table class="product-table"><thead><tr><th>Kategori</th><th>Target</th><th>ACV</th><th>Varian</th><th>ACV %</th></tr></thead>
              <tbody>${categories.map(item => {
                const variance = item.achievement - item.target;
                const pct = item.target ? (item.achievement / item.target) * 100 : 0;
                return `<tr><td>${item.label}</td><td>${formatRp(item.target)}</td><td>${formatRp(item.achievement)}</td><td>${formatRp(variance)}</td><td>${pct.toFixed(1)}%</td></tr>`;
              }).join('')}</tbody></table>
              <h3>Qty Apple Product</h3>
              <table class="product-table"><thead><tr><th>Unit</th><th>Qty</th><th>Total Harga</th></tr></thead>
              <tbody>${data.mading.units.map(item => `<tr><td>${item.label}</td><td>${item.qty}</td><td>${formatRp(item.amount)}</td></tr>`).join('')}</tbody></table>
              <div class="detail-metrics"><div class="detail-metric"><span class="detail-label">Total Harga Semua Unit</span><b>${formatRp(data.mading.units.reduce((sum, item) => sum + item.amount, 0))}</b></div></div>
              <h3>Qty dan nilai layanan</h3>
              <table class="product-table"><thead><tr><th>Layanan</th><th>Qty</th><th>Total Harga</th></tr></thead>
              <tbody>${data.mading.services.map(item => `<tr><td>${item.label}</td><td>${item.qty}</td><td>${formatRp(item.amount)}</td></tr>`).join('')}</tbody></table>
            </div>`;
          return;
        }
        if (!normalized && !dateKey) {
          detailRoot.innerHTML = '<div class="detail-empty">Ketik nama sales untuk melihat detail performa, LOB, dan insentif.</div>';
          return;
        }
        const matches = data.sales.filter(sale => nameQuery && sale.name.toLowerCase().includes(nameQuery));
        const hasNonSalesFilter = selectedUnit || periodKey || dateKey || isBnplFilter || isClosingReport || normalized === 'rahman';
        if (isClosingReport && (!nameQuery || !dateKey)) {
          detailRoot.innerHTML = '<div class="detail-empty">Report Closing memerlukan nama sales dan tanggal. Contoh: ketik “closing Virginia”, lalu pilih tanggal closing pada kalender.</div>';
          return;
        }
        if (!matches.length && !hasNonSalesFilter) {
          detailRoot.innerHTML = `<div class="detail-empty">Tidak ada data sales yang cocok dengan “${escapeHtml(query)}”.</div>`;
          return;
        }
        const isRahman = (isClosingReport && !nameQuery) || nameQuery.includes('rahman') || (!nameQuery && (normalized === 'm268' || periodKey));
        const dateSalesMap = dateKey ? ((data.dailySales[dateKey] || {}).sales || {}) : {};
        const dateSalesNames = new Set(Object.keys(dateSalesMap).map(name => name.toLowerCase()));
        const dateOnly = Boolean(dateKey) && !nameQuery && !isRahman && !isBnplFilter && !selectedUnit;
        const rows = dateOnly
          ? data.sales.filter(sale => dateSalesNames.has(sale.name.toLowerCase()))
          : isRahman || !matches.length ? data.sales : matches;
        const period = periodKey === 'LM' ? '2026-08' : periodKey === 'LY' ? '2025-09' : data.currentMonth;
        const daily = dateKey ? data.dailyBnpl[dateKey] : null;
        const monthly = data.periodTotals[period] || { amount: 0, qty: 0 };
        const providerRows = selectedBnplProvider
          ? data.bnpl.filter(item => item.label.toLowerCase().replace(/\s+/g, '').includes(selectedBnplProvider.replace(/\s+/g, '')))
          : data.bnpl;
        if (isBnplFilter && !nameQuery && !dateKey) {
          const providerText = selectedBnplProvider ? `Provider ${providerRows.map(item => item.label).join(', ')}` : 'Semua provider BNPL';
          detailRoot.innerHTML = `
            <div class="sales-detail">
              <div class="sales-header"><h3>${providerText}</h3><span>${periodKey || 'CM'}</span></div>
              <div class="detail-metrics">
                <div class="detail-metric"><span class="detail-label">BNPL Amount</span><b>${formatRp(providerRows.reduce((sum, item) => sum + item.value, 0))}</b></div>
                <div class="detail-metric"><span class="detail-label">Provider</span><b>${providerRows.length}</b></div>
                <div class="detail-metric"><span class="detail-label">BNPL Qty</span><b>${providerRows.reduce((sum, item) => sum + item.qty, 0)}</b></div>
                <div class="detail-metric"><span class="detail-label">Status</span><b>Contribution</b></div>
              </div>
              <div class="stack">${providerRows.map(item => `<div class="progress-row"><div class="progress-label">${escapeHtml(item.label)}</div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(item.value / Math.max(...providerRows.map(row => row.value), 1) * 100, 100)}%;background:${item.color}"></div></div><div class="progress-value">${formatRp(item.value)}</div></div>`).join('')}</div>
              <div class="refresh-info">Detail BNPL ditampilkan karena filter BNPL dipilih. Tanpa filter ini, BNPL hanya tampil pada bar kontribusi.</div>
            </div>`;
          return;
        }
        const total = rows.reduce((sum, sale) => sum + sale.revenue, 0);
        const incentive = rows.reduce((sum, sale) => sum + sale.estimatedIncentive, 0);
        const achievementAmount = rows.reduce((sum, sale) => sum + (sale.revenue || 0), 0);
        const achievementTarget = rows.reduce((sum, sale) => sum + (sale.target || 0), 0);
        const achievementPct = achievementTarget ? (achievementAmount / achievementTarget) * 100 : 0;
        const selectedNames = new Set(rows.map(sale => sale.name.toLowerCase()));
        const dateProviderSales = dateKey
          ? Object.entries((data.dailyProvider[dateKey] || {}).sales || {})
            .filter(([name]) => isRahman || selectedNames.has(name.toLowerCase()))
            .reduce((sum, [, values]) => sum + values.qty, 0)
          : 0;
        const dateQoalaSales = dateKey
          ? Object.entries((data.dailyQoala[dateKey] || {}).sales || {})
            .filter(([name]) => isRahman || selectedNames.has(name.toLowerCase()))
            .reduce((sum, [, values]) => sum + values.qty, 0)
          : 0;
        const qoala = dateKey ? dateQoalaSales : rows.reduce((sum, sale) => sum + sale.qoala, 0);
        const provider = dateKey ? dateProviderSales : rows.reduce((sum, sale) => sum + sale.provider, 0);
        const categoryTotals = [
          {
            label: 'Device',
            target: rows.reduce((sum, sale) => sum + sale.deviceTarget, 0),
            achievement: rows.reduce((sum, sale) => sum + sale.deviceAchievement, 0)
          },
          {
            label: 'Accessories',
            target: rows.reduce((sum, sale) => sum + sale.accessoriesTarget, 0),
            achievement: rows.reduce((sum, sale) => sum + sale.accessoriesAchievement, 0)
          },
          {
            label: 'VAS',
            target: rows.reduce((sum, sale) => sum + sale.vasTarget, 0),
            achievement: rows.reduce((sum, sale) => sum + sale.vasAchievement, 0)
          }
        ];
        const selectedProducts = rows.flatMap(sale => sale.products || [])
          .filter(product => (!selectedUnit || product.unit === unitMap[selectedUnit]) && (!dateKey || product.date === dateKey))
          .reduce((items, product) => {
            const existing = items.find(item => item.description === product.description);
            if (existing) {
              existing.qty += product.qty;
              existing.amount += product.amount;
            } else {
              items.push({ ...product });
            }
            return items;
          }, [])
          .sort((a, b) => b.qty - a.qty);
        const dateSales = dateKey
          ? Object.entries(dateSalesMap)
            .filter(([name]) => isRahman || selectedNames.has(name.toLowerCase()))
            .map(([name, values]) => ({
              name,
              amount: values.amount,
              qty: data.products
                .filter(product => product.date === dateKey && product.salesName === name)
                .reduce((sum, product) => sum + product.qty, 0)
            }))
            .sort((a, b) => b.amount - a.amount)
          : [];
        const dateTotalSales = dateKey
          ? dateSales.reduce((sum, sale) => sum + sale.amount, 0)
          : 0;
        const selectedDateRevenue = dateTotalSales;
        const dailyTarget = Number(data.dailyTarget || 0);
        const selectedDateAchievementPct = dailyTarget ? (selectedDateRevenue / dailyTarget) * 100 : 0;
        const dailyRows = dateKey
          ? dateSales.map(sale => {
            const values = (data.dailySales[dateKey] || {}).sales?.[sale.name] || {};
            return {
              ...sale,
              achievement: values.achievement || sale.amount,
              deviceAchievement: values.deviceAchievement || 0,
              accessoriesAchievement: values.accessoriesAchievement || 0,
              vasAchievement: values.vasAchievement || 0
            };
          })
          : [];
        const achievementRows = dateKey ? dailyRows : rows;
        const dateAppleQty = dateKey
          ? data.products.filter(product => (isRahman || selectedNames.has(product.salesName.toLowerCase())) && product.date === dateKey)
            .reduce((sum, product) => sum + product.qty, 0)
          : 0;
        const dateIncentive = dateKey
          ? data.products
            .filter(product => (isRahman || selectedNames.has(product.salesName.toLowerCase())) && product.date === dateKey)
            .reduce((sum, product) => sum + product.qty * (data.incentivePerUnit[product.unit] || 0), 0)
          : incentive;
        let combinedLob = Object.keys(data.incentivePerUnit).map(lob => ({
          lob,
          value: dateKey
            ? selectedProducts.filter(product => product.unit === lob).reduce((sum, product) => sum + product.qty, 0)
            : rows.reduce((sum, sale) => sum + (sale.lob[lob] || 0), 0)
        }));
        if (selectedUnit) combinedLob = combinedLob.filter(item => item.lob === unitMap[selectedUnit]);
        if (isClosingReport) {
          const closingDateLabel = new Date(`${dateKey}T00:00:00`).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
          const isTeamClosing = isRahman;
          const dailyTarget = Number(data.dailyTarget || 0);
          const selectedSale = rows.length === 1 ? rows[0] : null;
          const salesTarget = selectedSale?.target || 0;
          const salesDailyTarget = salesTarget ? salesTarget / 30 : dailyTarget;
          const targetPct = dailyTarget ? (dateTotalSales / dailyTarget) * 100 : 0;
          const closingStoreTarget = Number(data.closingTargetStore || dailyTarget);
          const closingSfTarget = Number(data.closingTargetSf || 0);
          const closingStorePct = closingStoreTarget ? (dateTotalSales / closingStoreTarget) * 100 : 0;
          const closingSfPct = closingSfTarget ? (dateTotalSales / closingSfTarget) * 100 : 0;
          const mtdRevenue = rows.reduce((sum, sale) => sum + (sale.revenue || 0), 0);
          const mtdTarget = rows.reduce((sum, sale) => sum + (sale.target || 0), 0);
          const mtdPct = mtdTarget ? (mtdRevenue / mtdTarget) * 100 : 0;
          const totalProductAmount = selectedProducts.reduce((sum, product) => sum + product.amount, 0);
          const totalAccessories = Math.max(dateTotalSales - totalProductAmount, 0);
          const dateServices = data.dailyServices?.[dateKey] || {};
          const previousDate = new Date(`${dateKey}T00:00:00`);
          previousDate.setDate(previousDate.getDate() - 7);
          const salesLw = data.dailySales?.[previousDate.toISOString().slice(0, 10)]?.amount || 0;
          const monthDate = new Date(`${dateKey}T00:00:00`);
          monthDate.setMonth(monthDate.getMonth() - 1);
          const salesLm = data.salesPeriodTotals?.[monthDate.toISOString().slice(0, 7)]?.amount || 0;
          const yearDate = new Date(`${dateKey}T00:00:00`);
          yearDate.setFullYear(yearDate.getFullYear() - 1);
          const salesLy = data.salesPeriodTotals?.[yearDate.toISOString().slice(0, 7)]?.amount || 0;
          const comparePct = value => closingStoreTarget ? ` (${(value / closingStoreTarget * 100).toFixed(0)}%)` : '';
          const lobRows = combinedLob.map(item => `<tr><td>${escapeHtml(item.lob)}</td><td>${item.value}</td></tr>`).join('');
          const topBottom = Object.entries(dateSalesMap)
            .sort(([, a], [, b]) => b.amount - a.amount)
            .map(([name, values]) => `<tr><td>${escapeHtml(name)}</td><td>${formatRp(values.amount)}</td></tr>`).join('');
          const reportRows = isTeamClosing
            ? [
              ['Target Store', `${formatRp(closingStoreTarget)} (${closingStorePct.toFixed(0)}%)`],
              ['Target SF', `${formatRp(closingSfTarget)} (${closingSfPct.toFixed(0)}%)`],
              ['Total Sales', formatRp(dateTotalSales)],
              [`Total Product ${closingDateLabel}`, formatRp(totalProductAmount)],
              ['Total Accessories', formatRp(totalAccessories)],
              ['Rate Accessories', `${dateTotalSales ? ((totalAccessories / dateTotalSales) * 100).toFixed(1) : '0.0'}%`],
              ['Total Mac', combinedLob.find(item => item.lob === 'Mac')?.value || 0],
              ['Total iPad', combinedLob.find(item => item.lob === 'iPad')?.value || 0],
              ['Total iPhone', combinedLob.find(item => item.lob === 'iPhone')?.value || 0],
              ['Total Apple Watch', combinedLob.find(item => item.lob === 'Apple Watch')?.value || 0],
              ['Total AirPods', combinedLob.find(item => item.lob === 'AirPods')?.value || 0],
              ['Total Qoala', data.dailyQoala?.[dateKey]?.amount ? formatRp(data.dailyQoala[dateKey].amount) : ''],
              ['Total Telkomsel', dateServices.Telkomsel?.amount ? formatRp(dateServices.Telkomsel.amount) : ''],
              ['Total Indosat', dateServices.Indosat?.amount ? formatRp(dateServices.Indosat.amount) : ''],
              ['Total XXL', dateServices.Xxl?.amount ? formatRp(dateServices.Xxl.amount) : ''],
              ['MTD Sales', `${formatRp(mtdRevenue)} (${mtdPct.toFixed(0)}%)`],
              ['Sales LW', `${formatRp(salesLw)}${comparePct(salesLw)}`],
              ['Sales LM', `${formatRp(salesLm)}${comparePct(salesLm)}`],
              ['Sales LY', `${formatRp(salesLy)}${comparePct(salesLy)}`],
            ]
            : [
              ['Target Store', `${formatRp(salesDailyTarget)} (${targetPct.toFixed(0)}%)`],
              ['Daily To Target', formatRp(Math.max(salesDailyTarget - dateTotalSales, 0))],
              [`Total Sales ${closingDateLabel}`, `${formatRp(dateTotalSales)} (${salesDailyTarget ? ((dateTotalSales / salesDailyTarget) * 100).toFixed(0) : '0'}%)`],
              ['Total Product', formatRp(totalProductAmount)],
              ['Total Accessories', formatRp(totalAccessories)],
              ['Total Qoala', formatRp(data.dailyQoala?.[dateKey]?.amount || 0)],
              ['Total Provider', formatRp(data.dailyProvider?.[dateKey]?.amount || 0)],
              ['MTD Sales', `${formatRp(mtdRevenue)} (${mtdPct.toFixed(0)}%)`],
              ['*Unit Terjual*', ''],
              ['*Reason*', ''],
            ];
          const reportText = [
            `*M268 - Closing Report ${closingDateLabel}*`,
            `Store : M268`,
            `Date : ${closingDateLabel}`,
            `Status : ${dateTotalSales ? 'Done' : 'Not Done'}`,
            ...reportRows.map(([label, value]) => `${label} : ${value}`),
            '',
            '*Unit Terjual*',
            ...combinedLob.map(item => `Total ${item.lob} : ${item.value}`),
            ...(isTeamClosing ? ['', '*Top - Buttom Sales*', ...Object.entries(dateSalesMap).sort(([, a], [, b]) => b.amount - a.amount).map(([name, values]) => `${name} : ${formatRp(values.amount)}`)] : []),
          ].join('\n');
          const copyReport = () => navigator.clipboard?.writeText(reportText).then(() => {
            const button = document.getElementById('copy-closing-report');
            if (button) button.textContent = 'Tersalin';
          });
          detailRoot.innerHTML = `<div class="sales-detail closing-report"><div class="sales-header"><h3>*M268 - Closing Report ${escapeHtml(closingDateLabel)}*</h3><span>${isTeamClosing ? 'Closing Team' : `${escapeHtml(selectedSale?.name || nameQuery)}`}</span></div><button type="button" class="copy-report" id="copy-closing-report">Salin Report</button><div class="closing-sheet"><table><tbody><tr><th>Store</th><td>M268</td></tr><tr><th>Date</th><td>${escapeHtml(closingDateLabel)}</td></tr><tr><th>Status</th><td>${dateTotalSales ? 'Done' : 'Not Done'}</td></tr>${reportRows.map(([label, value]) => `<tr><th>${escapeHtml(label)}</th><td>${escapeHtml(value)}</td></tr>`).join('')}</tbody></table><div class="closing-section">*Unit Terjual*</div><table><tbody>${combinedLob.map(item => `<tr><th>Total ${escapeHtml(item.lob)}</th><td>${item.value}</td></tr>`).join('')}</tbody></table>${isTeamClosing ? `<div class="closing-section">*Top - Buttom Sales*</div><table><tbody>${topBottom || '<tr><td>Tidak ada transaksi pada tanggal ini.</td></tr>'}</tbody></table>` : ''}</div><div class="refresh-info">Format closing mengikuti file asli dan difilter berdasarkan ${isTeamClosing ? 'seluruh team' : 'nama sales'} serta tanggal yang dipilih.</div></div>`;
          document.getElementById('copy-closing-report').addEventListener('click', copyReport);
          return;
        }
        const title = dateKey
          ? `Detail ${nameQuery ? rows.map(sale => escapeHtml(sale.name)).join(', ') : 'sales'} tanggal ${dateKey}`
          : isClosingReport ? 'Report Closing M268' : isRahman ? 'Detail Keseluruhan Tim' : rows.map(sale => escapeHtml(sale.name)).join(', ');
        const productTitle = dateKey
          ? `Detail unit terjual pada ${dateKey}${selectedUnit ? ` · ${unitMap[selectedUnit]}` : ''}`
          : selectedUnit ? `Detail unit ${unitMap[selectedUnit]}` : 'Detail unit terjual';
        const showBnplDateMetrics = Boolean(dateKey) && isBnplFilter && !selectedUnit && !nameQuery;
        const showDateSalesMetrics = Boolean(dateKey) && !showBnplDateMetrics;
        detailRoot.innerHTML = `
          <div class="sales-detail">
            <div class="sales-header"><h3>${title}</h3><span>${isClosingReport ? 'Bulan berjalan' : periodKey || 'M268'} · ${rows.length} sales</span></div>
            <div class="detail-metrics">
              <div class="detail-metric"><span class="detail-label">${showBnplDateMetrics ? 'BNPL Amount' : showDateSalesMetrics ? 'Total Sales' : 'Revenue'}</span><b>${formatRp(showBnplDateMetrics ? daily?.amount : showDateSalesMetrics ? (selectedUnit ? selectedProducts.reduce((sum, product) => sum + product.amount, 0) : dateTotalSales) : total)}</b></div>
              <div class="detail-metric"><span class="detail-label">${dateKey ? 'Achievement vs Target Harian' : 'Achievement Revenue'}</span><b>${dateKey ? `${selectedDateAchievementPct.toFixed(1)}%` : `${achievementPct.toFixed(1)}%`}</b><div class="refresh-info">${dateKey ? `Revenue ${formatRp(selectedDateRevenue)} vs Target harian ${formatRp(dailyTarget)}` : `Revenue ${formatRp(achievementAmount)} vs Target ${formatRp(achievementTarget)}`}</div></div>
              <div class="detail-metric"><span class="detail-label">${showBnplDateMetrics ? 'BNPL Qty' : showDateSalesMetrics ? 'Apple Unit Terjual' : 'Total Device'}</span><b>${showBnplDateMetrics ? (daily?.qty || 0) : showDateSalesMetrics ? (selectedUnit ? selectedProducts.reduce((sum, product) => sum + product.qty, 0) : dateAppleQty) : rows.reduce((sum, sale) => sum + sale.totalDevice, 0)}</b></div>
              <div class="detail-metric"><span class="detail-label">Est. Incentive</span><b>${formatRp(dateKey ? dateIncentive : incentive)}</b></div>
              <div class="detail-metric"><span class="detail-label">${dateKey ? 'Qoala tanggal' : 'Qoala'}</span><b>${qoala}</b></div>
              <div class="detail-metric"><span class="detail-label">${dateKey ? 'Provider tanggal' : 'Provider'}</span><b>${provider}</b></div>
            </div>
            <h3>Detail pencapaian kategori</h3>
            <div class="detail-metrics">${(dateKey ? [
              { label: 'Device', achievement: achievementRows.reduce((sum, sale) => sum + sale.deviceAchievement, 0), target: 0 },
              { label: 'Accessories', achievement: achievementRows.reduce((sum, sale) => sum + sale.accessoriesAchievement, 0), target: 0 },
              { label: 'VAS', achievement: achievementRows.reduce((sum, sale) => sum + sale.vasAchievement, 0), target: 0 }
            ] : categoryTotals).map(category => `
              <div class="detail-metric">
                <span class="detail-label">${category.label}</span>
                <b>${dateKey ? formatRp(category.achievement) : `${(category.target ? (category.achievement / category.target) * 100 : 0).toFixed(1)}%`}</b>
                <div class="refresh-info">${dateKey ? 'Pencapaian transaksi pada tanggal terpilih' : `Target ${formatRp(category.target)} · ${category.target ? ((category.achievement / category.target) * 100).toFixed(1) : '0.0'}%`}</div>
              </div>
            `).join('')}</div>
            <div class="stack">${combinedLob.map(item => `<div class="progress-row"><div class="progress-label">${item.lob}</div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(item.value * 3, 100)}%;background:#2f6fed"></div></div><div class="progress-value">${item.value} unit</div></div>`).join('')}</div>
            <h3>${productTitle}</h3>
            ${selectedProducts.length ? `<table class="product-table"><thead><tr><th>Produk</th><th>Unit</th><th>Nilai</th></tr></thead><tbody>${selectedProducts.map(product => `<tr><td>${escapeHtml(product.description)}</td><td>${product.qty}</td><td>${formatRp(product.amount)}</td></tr>`).join('')}</tbody></table>` : '<div class="detail-empty">Belum ada transaksi produk untuk filter ini pada bulan berjalan.</div>'}
            ${dateKey ? `<h3>Total sales per sales pada ${dateKey}</h3>${dateSales.length ? `<table class="product-table"><thead><tr><th>Sales</th><th>Apple Unit</th><th>Total Sales</th></tr></thead><tbody>${dateSales.map(sale => `<tr><td>${escapeHtml(sale.name)}</td><td>${sale.qty}</td><td>${formatRp(sale.amount)}</td></tr>`).join('')}</tbody></table>` : '<div class="detail-empty">Tidak ada transaksi pada tanggal ini.</div>'}` : ''}
            ${isBnplFilter ? `<div class="refresh-info">Periode ${period}: BNPL ${formatRp(monthly.amount)} / ${monthly.qty} transaksi.</div>` : ''}
            <div class="refresh-info">${isClosingReport ? 'Report closing dihitung dari seluruh transaksi bulan berjalan dan dapat difilter berdasarkan nama sales.' : 'Qoala mengikuti transaksi pada tanggal dan sales yang dipilih.'} Insentif: ${Object.entries(data.incentivePerUnit).map(([lob, rate]) => `${lob} ${formatRp(rate)}`).join(' · ')}</div>
          </div>`;
      }

      async function refreshData() {
        try {
          const response = await fetch(`dashboard_data.js?refresh=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const source = await response.text();
          const match = source.match(/window\.DASHBOARD_DATA\s*=\s*([\s\S]*);?\s*$/);
          if (!match) throw new Error('Format data dashboard tidak valid');
          data = JSON.parse(match[1].replace(/;\s*$/, ''));
          renderDashboard();
          refreshInfo.textContent = `Data terakhir diperbarui: ${new Date().toLocaleString('id-ID')} · refresh otomatis setiap 10 menit`;
        } catch (error) {
          refreshInfo.textContent = `Gagal memperbarui data: ${error.message}`;
        }
      }

      searchInput.addEventListener('input', event => renderSalesDetail(event.target.value));
      dateFilter.addEventListener('change', () => renderSalesDetail(searchInput.value));
      document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
        const filter = button.dataset.filter;
        if (filter !== 'M268' && filter !== 'CM' && filter !== 'LM' && filter !== 'LY') {
          dateFilter.value = '';
        }
        searchInput.value = filter;
        renderSalesDetail(searchInput.value);
      }));
      if (!window.dashboardReloading) {
        refreshData();
        setInterval(refreshData, 10 * 60 * 1000);
      }
    </script>
  </body>
</html>
